name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "release/**"
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync

      - name: Lint
        run: |
          pip install flake8
          flake8 src

      - name: Tests
        run: |
          pip install pytest
          pytest || true

      - name: Validate App Startup
        run: |
          export PYTHONPATH=src
          python -c "from src import app; print('App OK')"