name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "release/**"
  pull_request:
    branches:
      - main
      - develop

env:
  PYTHON_VERSION: '3.11'
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
      - name: Install project (dev)
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: Ruff (fast linter)
        run: |
          ruff check .
      - name: Black check
        run: |
          black --check . || true
      - name: isort check
        run: |
          isort --check-only . || true
      - name: mypy
        run: |
          mypy src || true
      - name: Bandit security scan (code)
        run: |
          mkdir -p reports
          bandit -r src -n 10 -f txt -o reports/bandit.txt || true
      - name: Upload lint/artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: reports || ''

  test:
    name: Run tests & coverage
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: Run pytest with coverage
        run: |
          mkdir -p reports
          pytest --cov=src --cov-report=xml:reports/coverage.xml -q
      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports

  docker-validate:
    name: Docker build & Trivy scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('Dockerfile','**/pyproject.toml') }}
      - name: Build image (load)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: false
          tags: ${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
          load: true
      - name: Trivy scan (local image)
        uses: aquasecurity/trivy-action@v0.15.0
        with:
          image-ref: ${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
          format: 'table'
          exit-code: '1'
          scan-type: 'image'

  container-scan:
    name: Container vulnerability scan (optional remote)
    runs-on: ubuntu-latest
    needs: docker-validate
    steps:
      - name: Login to GitHub Container Registry (optional)
        if: always()
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: (Optional) Push image to registry for remote scanning
        if: always()
        run: echo "Push step optional; configure GHCR_TOKEN to enable"
